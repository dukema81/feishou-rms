<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>飞育教育管理系统 · 离线演示</title>
<style>
/* 飞育教育管理系统 · 样式 */
:root {
  --pri: #ea580c;
  --pri-d: #16389f;
  --bg: #f4f6fb;
  --card: #fff;
  --line: #e3e8f2;
  --txt: #1a2333;
  --sub: #7684a0;
  --ok: #ea580c;
  --warn: #d99b0b;
  --err: #cf2f4b;
  --side: #101a33;
  --side-2: #1b2b52;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--txt);
  background: var(--bg);
  overflow-x: hidden;
}
a { color: var(--pri); text-decoration: none; }

/* ---------- 侧边栏 ---------- */
#sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 200px;
  background: var(--side); color: #c5cfdf; display: flex; flex-direction: column;
  z-index: 20;
}
.brand {
  padding: 18px 18px 4px; font-size: 18px; font-weight: 700; color: #fff;
  letter-spacing: 1px;
}
.brand-sub { padding: 0 18px 14px; font-size: 11.5px; color: #7d8aa5; }
#nav { flex: 1; overflow-y: auto; padding: 4px 8px; }
#nav a {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px; margin: 1px 0;
  color: #b9c5da; border-radius: 7px; font-size: 13.5px; position: relative;
}
#nav a .ic { width: 18px; text-align: center; font-size: 14px; }
#nav a:hover { background: var(--side-2); color: #fff; }
#nav a.on { background: var(--pri); color: #fff; }
#nav a .badge {
  margin-left: auto; background: var(--err); color: #fff; font-size: 11px;
  min-width: 18px; height: 18px; line-height: 18px; text-align: center;
  border-radius: 9px; padding: 0 5px; font-weight: 600;
}
#nav a.on .badge { background: rgba(255,255,255,.28); }
.side-foot {
  padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.08);
  font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.side-foot span { color: #8ba3a6; flex: 1; min-width: 80px; }

/* ---------- 主区 ---------- */
#main {
  margin-left: 200px; padding: 20px 24px 48px; min-height: 100vh;
}
h2.page { font-size: 19px; margin: 0 0 4px; font-weight: 650; }
.page-desc { color: var(--sub); font-size: 12.5px; margin-bottom: 14px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 14px;
}
.card h3 {
  margin: 0 0 12px; font-size: 14.5px; font-weight: 650; display: flex;
  align-items: center; gap: 8px;
}
.card h3 .sub { font-weight: 400; font-size: 12px; color: var(--sub); margin-left: auto; }

/* ---------- KPI ---------- */
.kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.kpi {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 18px; min-width: 130px; flex: 1;
}
.kpi b { display: block; font-size: 23px; font-weight: 700; line-height: 1.25; }
.kpi span { font-size: 12.5px; color: var(--sub); }
.kpi.ok b { color: var(--ok); }
.kpi.warn b { color: var(--warn); }
.kpi.err b { color: var(--err); }
.kpi.pri b { color: var(--pri); }

/* ---------- 工具条 ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.btn {
  border: 0; background: var(--pri); color: #fff; padding: 7px 14px;
  border-radius: 7px; font-size: 13px; cursor: pointer; font-family: inherit;
  transition: background .15s;
}
.btn:hover { background: var(--pri-d); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.ghost { background: #eaf0f1; color: var(--txt); }
.btn.ghost:hover { background: #dfe8e9; }
.btn.danger { background: var(--err); }
.btn.ok { background: var(--ok); }
.btn.sm { padding: 4px 10px; font-size: 12px; }

input, select, textarea {
  font-family: inherit; font-size: 13px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 7px; background: #fff;
  color: var(--txt); outline: none; max-width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--pri); }
textarea { resize: vertical; min-height: 84px; width: 100%; }

/* ---------- 表格 ---------- */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th { color: var(--sub); font-weight: 600; font-size: 12.5px; background: #f9fbfb; }
tbody tr:hover { background: #f6faf9; }
tr.click { cursor: pointer; }
td.wrap { white-space: normal; min-width: 180px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.tag {
  display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
  background: #eaf0f1; color: var(--sub);
}
.tag.ok { background: #e6f7ec; color: var(--ok); }
.tag.warn { background: #fff5e0; color: var(--warn); }
.tag.err { background: #fdedf0; color: var(--err); }
.tag.pri { background: #e3f4f2; color: var(--pri); }

.empty { color: var(--sub); text-align: center; padding: 44px 12px; font-size: 13px; }

/* ---------- 表单 ---------- */
.fld { display: block; margin-bottom: 12px; }
.fld > span { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; }
.fld input, .fld select, .fld textarea { width: 100%; }
.fld i { display: block; font-size: 11.5px; color: var(--sub); font-style: normal; margin-top: 3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }

/* ---------- 进度条 ---------- */
.bar { background: #eaf0f1; border-radius: 5px; height: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pri); border-radius: 5px; }
.bar i.warn { background: var(--warn); }
.bar i.err { background: var(--err); }
.bar i.ok { background: var(--ok); }

/* ---------- 竖向柱状图 ---------- */
.chart { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding: 6px 0 0; }
.chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
  align-items: center; gap: 4px; min-width: 0; }
.chart .col .bars { display: flex; gap: 3px; align-items: flex-end; height: 150px; }
.chart .col .bars i { width: 14px; border-radius: 3px 3px 0 0; background: var(--pri);
  display: block; min-height: 2px; }
.chart .col .bars i.b2 { background: #9ecfc9; }
.chart .col .lb { font-size: 11.5px; color: var(--sub); white-space: nowrap; }
.chart .col .vv { font-size: 11px; color: var(--txt); }

/* ---------- 横向条形排行 ---------- */
.rank { display: flex; flex-direction: column; gap: 9px; }
.rank .r { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.rank .r .n { width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .r .b { flex: 1; }
.rank .r .v { width: 96px; text-align: right; color: var(--sub);
  font-variant-numeric: tabular-nums; }

/* ---------- 时间线 ---------- */
.tl { position: relative; padding-left: 22px; }
.tl:before {
  content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px;
  width: 2px; background: var(--line);
}
.tl-item { position: relative; padding: 0 0 16px; }
.tl-item:before {
  content: ''; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px;
  border-radius: 50%; background: #fff; border: 2px solid var(--pri);
}
.tl-item.pass:before { border-color: var(--ok); }
.tl-item.reject:before { border-color: var(--err); }
.tl-item .t { font-size: 11.5px; color: var(--sub); }
.tl-item .h { font-weight: 600; font-size: 13.5px; margin: 1px 0; }
.tl-item .d { color: var(--sub); font-size: 12.5px; }

/* ---------- 风险卡片 ---------- */
.risk-list { display: flex; flex-direction: column; gap: 10px; }
.risk-item {
  background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--warn);
  border-radius: 9px; padding: 12px 16px;
}
.risk-item.lv-hi { border-left-color: var(--err); }
.risk-item.lv-mid { border-left-color: var(--warn); }
.risk-item.lv-lo { border-left-color: #9ecfc9; }
.risk-item .h { display: flex; align-items: center; gap: 8px; }
.risk-item .h b { font-size: 13.5px; }
.risk-item .d { color: var(--sub); font-size: 12.5px; margin: 4px 0 0; }

/* ---------- 税率卡 ---------- */
.rate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.rate-card {
  border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; background: #fff;
}
.rate-card b { display: block; font-size: 20px; color: var(--pri); }
.rate-card span { font-size: 12px; color: var(--sub); }

/* ---------- 弹层 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 28, 30, .45); z-index: 60;
  display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px;
  overflow-y: auto;
}
.modal {
  background: #fff; border-radius: 12px; padding: 20px 22px; width: 520px;
  max-width: 100%; box-shadow: 0 16px 48px rgba(0,0,0,.22);
}
.modal.wide { width: 800px; }
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.hidden { display: none !important; }

.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
  background: #1a2333; color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; z-index: 90; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  max-width: 80vw;
}

/* ---------- 结算卡 ---------- */
.settle {
  background: linear-gradient(135deg, #c2410c, #3b82f6); color: #fff;
  border-radius: 10px; padding: 16px 20px; margin-bottom: 14px;
}
.settle .row { display: flex; gap: 26px; flex-wrap: wrap; }
.settle .row > div b { display: block; font-size: 21px; font-weight: 700; }
.settle .row > div span { font-size: 12px; opacity: .82; }
.settle .note { margin-top: 10px; font-size: 12px; opacity: .85; }

/* ---------- 登录页 ---------- */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #101a33 0%, #1e3a8a 52%, #c2410c 130%);
  padding: 20px;
}
.login-box {
  background: #fff; border-radius: 14px; padding: 34px 32px; width: 372px;
  max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.login-box h1 { font-size: 21px; margin: 0 0 4px; }
.login-box p { color: var(--sub); font-size: 12.5px; margin: 0 0 22px; }
.login-box input { width: 100%; margin-bottom: 12px; padding: 10px 12px; }
.login-box .btn { width: 100%; padding: 10px; font-size: 14px; margin-top: 6px; }
.hint { font-size: 11.5px; color: var(--sub); text-align: center; margin-top: 14px;
  line-height: 1.8; }

/* ---------- 移动端 ---------- */
@media (max-width: 820px) {
  #sidebar {
    position: static; width: auto; flex-direction: row; align-items: center;
    overflow-x: auto; padding: 0 8px;
  }
  .brand { padding: 10px 8px; font-size: 15px; white-space: nowrap; }
  .brand-sub { display: none; }
  #nav { display: flex; padding: 6px 0; flex: 1; }
  #nav a { white-space: nowrap; padding: 6px 10px; }
  #nav a .ic { display: none; }
  .side-foot { border: 0; padding: 6px; }
  .side-foot span { display: none; }
  #main { margin-left: 0; padding: 14px 12px 40px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .kpi b { font-size: 20px; }
  .chart { height: 160px; }
  .chart .col .bars { height: 120px; }
}

/* ---------- 飞育扩展 ---------- */
.sub-cell { font-size: 12px; color: var(--sub); max-width: 280px; white-space: normal; }
.rowitem { padding: 8px 4px; border-bottom: 1px dashed var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.rowitem.hot b { color: var(--err); }
.rowitem i { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--sub); }
.rowitem p { width: 100%; margin: 2px 0 0; font-size: 12.5px; color: var(--sub); }
table.week th { text-align: center; padding: 6px 4px; font-size: 12.5px; }
table.week td { border: 1px solid var(--line); padding: 3px; vertical-align: top; height: 46px; }
.slot b { display: block; font-size: 12px; color: var(--pri); }
.slot i { font-style: normal; font-size: 11px; color: var(--sub); }
.card.hot { border-color: #f3c1cb; background: #fff7f8; }
select, input[type=number] { margin-left: 6px; }

.pos-sum{font-size:15px;font-weight:600;color:#ea580c;padding:8px 4px;}


.demo-bar{position:fixed;left:0;right:0;top:0;z-index:99;background:#fff8e6;color:#7a5b12;
  border-bottom:1px solid #f0d9a8;font-size:12.5px;padding:7px 16px;text-align:center;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.demo-bar b{color:#b8791b}
.demo-bar .who{margin-left:12px;padding-left:12px;border-left:1px solid #f0d9a8}
.demo-bar select{font-size:12.5px;padding:2px 6px;border:1px solid #e0c98f;border-radius:4px;
  background:#fff;color:#7a5b12}
body{padding-top:34px}

</style>
</head>

var TOKEN = localStorage.getItem('retail_token') || '';

var PERMS = ME.perms || [];

function api(method, path, body, raw) {
  return fetch(PREFIX + path, {
    method: method,
    headers: Object.assign({'Content-Type': 'application/json'},
      TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {}),
    body: (method === 'POST' || method === 'PUT' || method === 'DELETE') ? JSON.stringify(body || {}) : undefined
  }).then(function (r) {
    if (r.status === 401) { localStorage.clear(); location.href = 'login.html'; throw new Error('unauth'); }
    if (r.status >= 400) {
      return r.text().then(function (t) {
        var msg = 'HTTP ' + r.status;
        try { msg = (JSON.parse(t) || {}).message || msg; } catch (e) { /* 非 JSON */ }
        throw new Error(msg);
      });
    }
    return raw ? r.text() : r.json();
  }).then(function (j) {
    if (raw) return j;
    if (j && j.code && j.code !== 200) throw new Error(j.message || ('错误 ' + j.code));
    return j;
  });
}
function GET(p) { return api('GET', p); }
function POST(p, b) { return api('POST', p, b); }
function PUT(p, b) { return api('PUT', p, b); }
function DEL(p) { return api('DELETE', p); }
function CSV(p) { return api('GET', p, null, true); }

function toast(msg, err) {

  t.textContent = msg;

  t.classList.remove('hidden');
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.classList.add('hidden'); }, 2600);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
  });
}
function perm(p) {
  if (PERMS.indexOf('*') >= 0) return true;
  if (PERMS.indexOf(p) >= 0) return true;
  if (p.slice(-5) === '.read' && PERMS.indexOf(p.slice(0, -5) + '.*') >= 0) return true;
  return false;
}

function fmtMoney(n, noSym) {
  if (n == null || n === '') return '—';
  var v = Number(n);
  var s = Math.abs(v) >= 10000
    ? v.toLocaleString('zh-CN', {maximumFractionDigits: 2})
    : v.toFixed(2);
  return (noSym ? '' : '¥') + s;
}
function fmtCents(c, noSym) {
  if (c == null || c === '') return '—';
  return fmtMoney(Number(c) / 100, noSym);
}
function fmtPct(x, digits) {
  if (x == null || x === '') return '—';
  return (Number(x) * 100).toFixed(digits == null ? 0 : digits) + '%';
}

    if (h && h.charAt(0) === '~') return '<th class="num">' + h.slice(1) + '</th>';
    return '<th>' + h + '</th>';
  }).join('') + '</tr></thead><tbody>' + rows.map(rowHtml).join('') + '</tbody></table></div>';
}

function tag(text, cls) {
  return '<span class="tag ' + (cls || '') + '">' + esc(text) + '</span>';
}
var SALE_TAG = {'cart': ['购物车', ''], 'paid': ['已支付', 'ok'], 'refunded': ['已退货', 'err'], 'cancelled': ['已取消', 'err']};
function saleTag(s) {
  var m = SALE_TAG[s] || [s, ''];
  return tag(m[0], m[1]);
}
var PO_TAG = {'draft': ['草稿', ''], 'submitted': ['已提交', 'pri'], 'received': ['已入库', 'ok'], 'cancelled': ['已取消', 'err']};
function poTag(s) {
  var m = PO_TAG[s] || [s, ''];
  return tag(m[0], m[1]);
}
var LEVEL_TAG = {'normal': ['普通会员', ''], 'silver': ['银卡 95折', ''], 'gold': ['金卡 9折', 'pri'], 'platinum': ['铂金 85折', 'ok']};
function memberTag(l) {
  var m = LEVEL_TAG[l] || [l, ''];
  return tag(m[0], m[1]);
}
function payTag(t) {
  var m = {'cash': '现金', 'wechat': '微信', 'alipay': '支付宝', 'balance': '储值'};
  return tag(m[t] || t, '');
}
function levelTag(g) {
  var m = {'risk': '高风险', 'warn': '警告', 'info': '提示'};
  return tag(m[g] || g, g === 'risk' ? 'err' : (g === 'warn' ? 'warn' : ''));
}
function kpi(v, label, cls) {
  return '<div class="kpi ' + (cls || '') + '"><b>' + esc(v) + '</b><span>' + esc(label) + '</span></div>';
}
function field(label, input, hint) {
  return '<label class="fld"><span>' + esc(label) + '</span>' + input +
    (hint ? '<i>' + esc(hint) + '</i>' : '') + '</label>';
}
function dl(p, name) {
  CSV(p).then(function (t) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([t], {type: 'text/csv;charset=utf-8'}));
    a.download = name || 'export.csv';
    a.click();
  }).catch(function (e) { toast(e.message, true); });
}
function qs(o) {
  var k = Object.keys(o || {}).filter(function (x) { return o[x]; });
  if (!k.length) return '';
  return '?' + k.map(function (x) { return x + '=' + encodeURIComponent(o[x]); }).join('&');
}

</script>

      document.getElementById('list').innerHTML = table(
        ['单号', '时间', '~小计', '~促销优惠', '~会员优惠', '~实收', '支付', '状态', '操作'], r.data.items, function (x) {
          var ops = (perm('retail.sales.write') && x.status === 'paid')
            ? '<button class="btn sm ghost" data-ref="' + x.id + '">退货</button>' : '—';
          return '<tr><td>' + esc(x.no) + '</td><td>' + esc(x.created_at) + '</td>' +
            '<td class="num">' + fmtCents(x.subtotal_cents) + '</td>' +
            '<td class="num">' + (x.promo_off_cents ? '−' + fmtCents(x.promo_off_cents) : '—') + '</td>' +
            '<td class="num">' + (x.member_off_cents ? '−' + fmtCents(x.member_off_cents) : '—') + '</td>' +
            '<td class="num"><b>' + fmtCents(x.paid_cents) + '</b></td>' +
            '<td>' + payTag(x.pay_method) + '</td><td>' + saleTag(x.status) + '</td>' +
            '<td class="ops">' + ops + '</td></tr>';
        });
      document.getElementById('list').onclick = function (e) {
        var b = e.target.closest('button'); if (!b || !b.getAttribute('data-ref')) return;
        var id = b.getAttribute('data-ref');
        if (!confirm('确认退货？库存回补、积分冲减、退款走负流水。')) return;
        POST('/api/sales/' + id + '/refund', {}).then(function (r2) {
          toast('退货成功：' + r2.data.refund_no + '，退款 ' + fmtCents(r2.data.refund_cents));
          load(document.getElementById('f-status').value);
        }).catch(function (e2) { toast(e2.message, true); });
      };
    });
  }
  document.getElementById('btn-filter').onclick = function () { load(document.getElementById('f-status').value); };
  load();
};

/* ---------- 库存管理 ---------- */
PAGES.inventory = function (main) {
  main.innerHTML = '<h2>库存管理</h2><div class="toolbar">' +
    '<select id="f-store"><option value="">全部门店</option></select>' +
    '<input id="f-kw" placeholder="商品名称" class="inp">' +
    '<button class="btn ghost" id="btn-search">搜索</button>' +
    '<button class="btn ghost" id="btn-export">导出 CSV</button></div><div id="list"></div>';
  document.getElementById('btn-export').onclick = function () { dl('/api/export/inventory', 'inventory.csv'); };
  GET('/api/stores').then(function (r) {
    document.getElementById('f-store').innerHTML += r.data.items.map(function (s) {
      return '<option value="' + s.id + '">' + esc(s.name) + '</option>';
    }).join('');
  });
  function load(sid, kw) {
    GET('/api/inventory' + qs({store_id: sid, keyword: kw})).then(function (r) {
      document.getElementById('list').innerHTML = table(
        ['商品', 'SKU', '门店', '批次', '~数量', '效期', '状态'], r.data.items, function (x) {
          var expSoon = x.expire_at && (new Date(x.expire_at) - new Date()) < 90 * 86400000;
          return '<tr><td>' + esc(x.commodity_name || x.commodity_id) + '</td><td>' + esc(x.sku || '') + '</td>' +
            '<td>' + tag('门店 #' + x.store_id, '') + '</td><td>' + esc(x.batch_no) + '</td>' +
            '<td class="num">' + x.qty + '</td><td>' + esc(x.expire_at || '—') + '</td>' +
            '<td>' + (expSoon ? tag('临期', 'warn') : tag('正常', 'ok')) + '</td></tr>';
        });
    });
  }
  document.getElementById('btn-search').onclick = function () {
    load(document.getElementById('f-store').value, document.getElementById('f-kw').value.trim());
  };
  load();
};

/* ---------- 采购管理 ---------- */
PAGES.purchase = function (main) {
  main.innerHTML = '<h2>采购管理</h2><div class="toolbar">' +
    (perm('retail.purchases.write') ? '<button class="btn" id="btn-new">新建采购单</button>' : '') +
    '<select id="f-status"><option value="">全部状态</option><option value="draft">草稿</option>' +
    '<option value="submitted">已提交</option><option value="received">已入库</option></select>' +
    '<button class="btn ghost" id="btn-filter">筛选</button></div><div id="list"></div>';
  function actBtn(x) {
    if (!perm('retail.purchases.write')) return '—';
    var m = {'draft': [['to_submitted', '提交']],
             'submitted': [['to_received', '入库确认']]};
    return (m[x.status] || []).map(function (a) {
      return '<button class="btn sm ghost" data-id="' + x.id + '" data-act="' + a[0] + '">' + a[1] + '</button>';
    }).join(' ') || '—';
  }
  function load(st) {
    GET('/api/purchases' + qs({status: st})).then(function (r) {
      document.getElementById('list').innerHTML = table(
        ['采购单号', '时间', '供应商', '~金额', '状态', '操作'], r.data.items, function (x) {
          return '<tr><td>' + esc(x.no) + '</td><td>' + esc(x.created_at) + '</td>' +
            '<td>' + esc((x.supplier || {}).name || '') + '</td>' +
            '<td class="num">' + fmtCents(x.total_cents) + '</td><td>' + poTag(x.status) + '</td>' +
            '<td class="ops">' + actBtn(x) + '</td></tr>';
        });
      document.getElementById('list').onclick = function (e) {
        var b = e.target.closest('button'); if (!b) return;
        POST('/api/purchases/' + b.getAttribute('data-id') + '/transition', {action: b.getAttribute('data-act')})
          .then(function (r2) {
            toast(r2.data.status === 'received' ? '入库成功，库存与应付已更新' : '操作成功');
            load(document.getElementById('f-status').value);
          }).catch(function (e2) { toast(e2.message, true); });
      };
    });
  }
  document.getElementById('btn-filter').onclick = function () { load(document.getElementById('f-status').value); };
  if (document.getElementById('btn-new'))
    document.getElementById('btn-new').onclick = function () {
      Promise.all([GET('/api/suppliers'), GET('/api/stores'), GET('/api/commodities')]).then(function (rs) {
        var comms = rs[2].data.items;
        modal('<h3>新建采购单</h3>' +
          field('供应商', '<select id="f-sup">' + rs[0].data.items.map(function (s) {
            return '<option value="' + s.id + '">' + esc(s.name) + '</option>';
          }).join('') + '</select>') +
          field('入库门店', '<select id="f-store">' + rs[1].data.items.map(function (s) {
            return '<option value="' + s.id + '">' + esc(s.name) + '</option>';
          }).join('') + '</select>') +
          '<div id="po-items"></div>' +
          '<div class="toolbar"><button class="btn sm ghost" id="btn-add-item">＋ 添加明细</button></div>' +
          '<div class="m-foot"><button class="btn" id="btn-ok">保存采购单</button>' +
          '<button class="btn ghost" onclick="closeModal()">取消</button></div>', true);
        var n = 0;
        function addItem() {
          n++;
          document.getElementById('po-items').insertAdjacentHTML('beforeend',
            '<div class="fld-row" data-row="' + n + '">' +
            '<select class="i-comm">' + comms.map(function (c) {
              return '<option value="' + c.id + '">' + esc(c.name) + '</option>';
            }).join('') + '</select>' +
            '<input class="i-qty" type="number" value="10" min="1" placeholder="数量" style="width:70px">' +
            '<input class="i-cost" type="number" placeholder="进价(分)" style="width:90px">' +
            '<input class="i-batch" placeholder="批次" style="width:110px">' +
            '<input class="i-exp" type="date" style="width:140px">' +
            '</div>');
        }
        addItem();
        document.getElementById('btn-add-item').onclick = addItem;
        document.getElementById('btn-ok').onclick = function () {
          var items = [];
          document.querySelectorAll('#po-items .fld-row').forEach(function (row) {
            items.push({
              commodity_id: Number(row.querySelector('.i-comm').value),
              qty: Number(row.querySelector('.i-qty').value || 1),
              cost_cents: Number(row.querySelector('.i-cost').value || 0),
              batch_no: row.querySelector('.i-batch').value.trim() || null,
              expiry: row.querySelector('.i-exp').value || null
            });
          });
          POST('/api/purchases', {
            supplier_id: Number(document.getElementById('f-sup').value),
            store_id: Number(document.getElementById('f-store').value),
            items: items
          }).then(function (r2) {
            toast('采购单已创建：' + r2.data.no);
            closeModal(); load();
          }).catch(function (e) { toast(e.message, true); });
        };
      });
    };
  load();
};

/* ---------- 供应商 ---------- */
PAGES.supplier = function (main) {
  main.innerHTML = '<h2>供应商管理</h2><div class="toolbar">' +
    (perm('retail.suppliers.write') ? '<button class="btn" id="btn-new">新增供应商</button>' : '') +
    '</div><div id="list"></div>';
  function load() {
    GET('/api/suppliers').then(function (r) {
      document.getElementById('list').innerHTML = table(
        ['名称', '联系人', '电话', '~账期(天)', '~应付金额', '~欠款上限'], r.data.items, function (x) {
          return '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.contact || '—') + '</td>' +
            '<td>' + esc(x.phone || '—') + '</td><td class="num">' + x.credit_days + '</td>' +
            '<td class="num">' + fmtCents(x.payable_cents) + '</td>' +
            '<td class="num">' + fmtCents(x.debt_limit_cents) + '</td></tr>';
        });
    });
  }
  if (document.getElementById('btn-new'))
    document.getElementById('btn-new').onclick = function () {
      modal('<h3>新增供应商</h3>' +
        field('名称', '<input id="f-name">') +
        field('联系人', '<input id="f-contact">') +
        field('电话', '<input id="f-phone">') +
        field('账期(天)', '<input id="f-days" type="number" value="30">') +
        field('欠款上限(元)', '<input id="f-debt" type="number" value="50000">') +
        '<div class="m-foot"><button class="btn" id="btn-ok">保存</button>' +
        '<button class="btn ghost" onclick="closeModal()">取消</button></div>');
      document.getElementById('btn-ok').onclick = function () {
        POST('/api/suppliers', {
          name: document.getElementById('f-name').value.trim(),
          contact: document.getElementById('f-contact').value.trim(),
          phone: document.getElementById('f-phone').value.trim(),
          credit_days: Number(document.getElementById('f-days').value || 30),
          debt_limit_cents: Math.round(Number(document.getElementById('f-debt').value || 0) * 100)
        }).then(function () { toast('已保存'); closeModal(); load(); })
          .catch(function (e) { toast(e.message, true); });
      };
    };
  load();
};

/* ---------- 财务流水 ---------- */
PAGES.finance = function (main) {
  main.innerHTML = '<h2>财务流水</h2><div class="toolbar">' +
    '<button class="btn ghost" id="btn-export">导出 CSV</button></div><div id="sum"></div><div id="list"></div>';
  document.getElementById('btn-export').onclick = function () { dl('/api/export/transactions', 'transactions.csv'); };
  Promise.all([GET('/api/finance/summary'), GET('/api/transactions')]).then(function (rs) {
    var s = rs[0].data, items = rs[1].data.items;
    var methods = Object.keys(s.by_method || {}).map(function (m) {
      return kpi(fmtCents(s.by_method[m]), '今日·' + m);
    }).join('');
    document.getElementById('sum').innerHTML = '<div class="kpis">' +
      kpi(fmtCents(s.income_cents), '今日收入', 'ok') +
      kpi(fmtCents(s.refund_cents), '今日退款', 'err') +
      kpi(s.sale_count, '销售单') +
      kpi(s.member_new, '新增会员') + methods + '</div>';
    var TT = {'income': ['收入', 'ok'], 'expense': ['采购', 'warn'], 'refund': ['退款', 'err']};
    document.getElementById('list').innerHTML = table(
      ['时间', '类型', '~金额', '方式', '备注'], items, function (x) {
        var t = TT[x.ttype] || [x.ttype, ''];
        return '<tr><td>' + esc(x.created_at) + '</td><td>' + tag(t[0], t[1]) + '</td>' +
          '<td class="num">' + fmtCents(x.amount_cents) + '</td><td>' + esc(x.pay_method || '—') + '</td>' +
          '<td>' + esc(x.note || '') + '</td></tr>';
      });
  });
};

/* ---------- 风险预警 ---------- */
PAGES.risk = function (main) {
  main.innerHTML = '<h2>风险预警</h2><div class="toolbar">' +
    (perm('retail.risk.write') ? '<button class="btn" id="btn-scan">立即扫描</button>' : '') +
    '</div><div id="list"></div>';
  function load() {
    GET('/api/risks').then(function (r) {
      document.getElementById('list').innerHTML = table(
        ['类型', '标题', '详情', '~评分', '等级', '状态', '操作'], r.data.items, function (x) {
          var ops = '';
          if (perm('retail.risk.write') && x.status === 'open')
            ops = '<button class="btn sm ghost" data-res="' + x.id + '">处理</button>';
          var rt = {'stock_low': '商品低库存', 'expiry_near': '效期预警', 'negative_margin': '负毛利',
                    'supplier_overdue': '欠款超限'}[x.rtype] || x.rtype;
          return '<tr><td>' + esc(rt) + '</td><td>' + esc(x.title) + '</td><td>' + esc(x.detail || '') + '</td>' +
            '<td class="num">' + x.score + '</td><td>' + levelTag(x.grade) + '</td>' +
            '<td>' + tag(x.status === 'open' ? '未处理' : '已处理', x.status === 'open' ? 'err' : 'ok') + '</td>' +
            '<td class="ops">' + (ops || '—') + '</td></tr>';
        });
      document.getElementById('list').onclick = function (e) {
        var b = e.target.closest('button'); if (!b || !b.getAttribute('data-res')) return;
        PUT('/api/risks/' + b.getAttribute('data-res') + '/resolve', {note: '已人工处理'})
          .then(function () { toast('已处理'); load(); }).catch(function (e2) { toast(e2.message, true); });
      };
    });
  }
  if (document.getElementById('btn-scan'))
    document.getElementById('btn-scan').onclick = function () {
      POST('/api/risks/scan', {}).then(function (r) {
        toast('扫描完成，新增 ' + r.data.created + ' 条'); load();
      }).catch(function (e) { toast(e.message, true); });
    };
  load();
};

/* ---------- 系统管理 ---------- */
PAGES.system = function (main) {
  main.innerHTML = '<h2>系统管理</h2><div class="grid2">' +
    '<div class="card"><h3>用户</h3><div id="users">加载中…</div></div>' +
    '<div class="card"><h3>公告</h3><div id="notices">加载中…</div></div>' +
    (perm('*') ? '<div class="card"><h3>API Key（对接外部系统）</h3><div id="keys">加载中…</div></div>' +
      '<div class="card"><h3>增量同步状态</h3><div id="sync">加载中…</div></div>' : '') +
    '</div>';
  GET('/api/users').then(function (r) {
    document.getElementById('users').innerHTML = table(
      ['用户名', '姓名', '角色'], r.data.items, function (x) {
        return '<tr><td>' + esc(x.username) + '</td><td>' + esc(x.name || '') + '</td><td>' + esc(x.role) + '</td></tr>';
      });
  }).catch(function () { document.getElementById('users').innerHTML = '<div class="empty">无权限</div>'; });
  GET('/api/notices').then(function (r) {
    document.getElementById('notices').innerHTML = (r.data.items || []).map(function (n) {
      return '<p><b>' + esc(n.title) + '</b><br>' + esc(n.content || '') + '</p>';
    }).join('') || '<div class="empty">暂无</div>';
  });
  if (perm('*')) {
    GET('/api/api-keys').then(function (r) {
      document.getElementById('keys').innerHTML =
        '<div class="toolbar"><button class="btn sm" id="btn-key">生成 Key</button></div>' +
        table(['名称', '前缀', '权限', '最近使用'], r.data.items, function (x) {
          return '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.prefix || '') + '</td>' +
            '<td>' + esc(x.perms) + '</td><td>' + esc(x.last_used || '—') + '</td></tr>';
        });
      document.getElementById('btn-key').onclick = function () {
        POST('/api/api-keys', {name: '外部对接-' + Date.now() % 10000}).then(function (r2) {
          modal('<h3>API Key 已生成（仅显示一次）</h3><p class="key-line">' + esc(r2.data.key) + '</p>' +
            '<div class="m-foot"><button class="btn" onclick="closeModal()">我已保存</button></div>');
        });
      };
    });
    GET('/api/sync?since=0&entities=commodities').then(function (r) {
      var d = r.data || {};
      document.getElementById('sync').innerHTML =
        '<p>同步版本：<b>' + (d.version || 0) + '</b>，本轮变更 <b>' + (d.changes || []).length + '</b> 条</p>' +
        '<p>支持实体：stores / commodities / members / promotions / sales / inventory / purchases / risks</p>';
    });
  }
};

</script>
<script>boot();</script>
</body>
